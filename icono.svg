<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Los colores van como atributos para que se vea en cualquier lado; el <style> solo
       los cambia en modo oscuro, en los programas que lo entienden (los navegadores). -->
  <style>
    @media (prefers-color-scheme: dark) {
      .trazo { stroke: #6ea8fe; }
      .relleno { fill: #6ea8fe; }
    }
  </style>
  <!-- líquido -->
  <path class="relleno" fill="#2563eb" opacity=".28"
        d="M8.9 20H23.1L26 25.3a1.4 1.4 0 0 1-1.2 2.2H7.2a1.4 1.4 0 0 1-1.2-2.2Z"/>
  <!-- matraz: borde, cuello y cuerpo -->
  <path class="trazo" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"
        stroke-linejoin="round"
        d="M11 3h10M13 3v9L5.6 25.4A2 2 0 0 0 7.4 28.5h17.2a2 2 0 0 0 1.8-3.1L19 12V3"/>
  <!-- burbujas -->
  <circle class="relleno" fill="#2563eb" cx="14" cy="23.6" r="1.4"/>
  <circle class="relleno" fill="#2563eb" cx="18.6" cy="22" r="1"/>
  <circle class="relleno" fill="#2563eb" cx="16.4" cy="16.4" r="0.9"/>
</svg>
