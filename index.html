<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PseudoLab</title>
<link rel="icon" href="icono.svg" type="image/svg+xml">
<script src="coi.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
      crossorigin="anonymous">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header class="barra">
  <div class="logo" id="logo">
    <img src="icono.svg" alt="" width="28" height="28">
    <div>
      <h1>PseudoLab</h1>
      <p class="bajada">Escribí, verificá y ejecutá tu pseudocódigo</p>
    </div>
  </div>
  <!-- La acción principal, sola y destacada. Los atajos de los tooltips los completa
       app.js, porque dependen del navegador y del sistema (Ctrl o ⌘). -->
  <div class="grupo">
    <button id="btn-ejecutar" class="principal" disabled data-ayuda="Ejecuta el programa">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="none"/>
      </svg>
      <span class="etiqueta">Ejecutar</span>
    </button>
    <button id="btn-detener" class="detener" hidden data-ayuda="Corta el programa que está corriendo">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>
      </svg>
      <span class="etiqueta">Detener</span>
    </button>
  </div>

  <span class="separador" aria-hidden="true"></span>

  <div class="grupo archivos" role="group" aria-label="Archivos">
    <button id="btn-nuevo" class="tenue" data-ayuda="Empieza un programa nuevo, desde cero">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
        <path d="M14 3v5h5M12 11v6M9 14h6"/>
      </svg>
      <span class="etiqueta">Nuevo</span>
    </button>
    <button id="btn-abrir" class="tenue" data-ayuda="Abre un programa guardado en un archivo">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      <span class="etiqueta">Abrir</span>
    </button>
    <button id="btn-guardar" class="tenue" data-ayuda="Guarda el programa en un archivo">
      <svg class="icono icono-guardar" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <path d="M17 21v-8H7v8M7 3v5h8"/>
      </svg>
      <!-- Donde el navegador no deja escribir sobre un archivo, el botón descarga -->
      <svg class="icono icono-descargar" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>
      </svg>
      <span class="etiqueta">Guardar</span>
    </button>
  </div>

  <p id="estado" class="estado">Cargando…</p>

  <span class="separador" aria-hidden="true"></span>

  <button id="btn-ayuda" class="tenue" data-ayuda-lado="izquierda"
          data-ayuda="¿Qué puedo escribir?&#10;Todo el lenguaje, con ejemplos">
    <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>
    </svg>
    <span class="etiqueta">Referencia</span>
  </button>
  <!-- Para los navegadores que no dejan elegir el archivo con su propio diálogo -->
  <input type="file" id="selector-archivo" accept=".txt,.pseudo,text/plain" hidden>
</header>

<main class="tablero">

  <section class="panel panel-editor">
    <div class="titulo-panel">
      <h2>Tu programa</h2>
      <span id="archivo" class="archivo"></span>
      <span id="resumen" class="resumen"></span>
    </div>
    <div id="editor"></div>
    <div id="diagnosticos" class="diagnosticos" hidden></div>
  </section>

  <section class="panel panel-consola">
    <div class="titulo-panel">
      <h2>Resultado</h2>
      <button id="btn-limpiar" class="enlace">Limpiar</button>
    </div>
    <div id="consola" class="consola" tabindex="0">
      <p class="vacio">Acá vas a ver lo que muestra tu programa, y acá mismo vas a
         escribir cuando el programa te pida datos con <code>Leer</code>.</p>
    </div>
    <div id="precarga" class="precarga" hidden>
      <label for="datos">Datos de entrada <span>(uno por línea, uno por cada <code>Leer</code>)</span></label>
      <textarea id="datos" rows="4" spellcheck="false"></textarea>
    </div>
  </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"
        crossorigin="anonymous"></script>
<!-- runmode pinta los ejemplos de la referencia con el mismo modo que el editor -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"
        crossorigin="anonymous"></script>
<script src="ayuda.js"></script>
<script src="app.js"></script>
</body>
</html>
